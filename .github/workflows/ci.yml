name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore src/BranchTeller.Api/BranchTeller.Api.csproj

      - name: Build
        run: dotnet build src/BranchTeller.Api/BranchTeller.Api.csproj --no-restore -c Release

      - name: Build Docker image
        run: docker build -t branchteller-api .